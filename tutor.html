<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher's Page/</title>
<link rel="stylesheet" href="cssAll.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
<style>
        body {
            background-color: rgb(198, 204, 209);
            color:steelblue;
        }

        header {
            background-color: navy;
            color: aliceblue;
            padding: 10px 0px;
            display: flex;
            justify-content:center;
            align-items: center;
        }

        header h1 {
            font-weight:50px;
            font-size:32px;
        }

        header button { 
            background:#ff260e;
            margin-right: 5px;
            padding:8px 12px; 
            border-radius:6px; 
            cursor:pointer;
            color:rgb(255, 255, 255);
        }

        header button:hover { 
            background:#ef563b; 
        }

        .container {
            display: flex;
            max-width: 1200px;
            margin: 60px auto;
            gap: 20px;
        }

        .left, .right {
            background-color: rgb(228, 247, 248);
            border-radius: 8px;
            padding: 20px;
            box-shadow:80px 80px 120px rgba(0, 0, 0, 0.1);
            min-height: 500px;
            overflow-y: scroll;
        }

        .left {
            flex: 2;
            max-height: 80vh;
        }

        .right {
            flex:1;
            display:flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            gap: 20px;
        }

        button { 
            cursor:pointer;
            padding:8px 14px; 
            border-radius:6px;
            background:#3498db; 
            color:white; 
            margin: 10px 0px;
        }

        button:hover { 
            background:#208ad1; 
        }

        #subjectListContainer {
          margin-top: 20px;
        }

        .subject { 
            margin-bottom:20px; 
            border-left:4px solid #3498db; 
            padding:12px 16px; 
            border-radius:8px; 
            background:#f9fbfd; 
        }

        .subject h3 { 
            display:flex; 
            justify-content:space-between; 
            align-items:center; font-size:18px; 
            margin-bottom:8px; 
        }

        .lesson { padding:8px 12px; 
            margin:5px 0 0 20px; 
            border-radius:6px; 
            font-weight:500; 
            transition:0.2s; 
            display:flex; 
            justify-content:space-between; 
            align-items:center; 
        }

        .lesson.online { 
            background:#2ecc71; 
            color:white; 
            cursor:pointer; 
        }

        .lesson.online:hover { 
            background:#098e41; 
        }
        .lesson.offline { 
            background:#bdc3c7; 
            color:white; 
            cursor:default; 
        }

        .liveBox h2 { 
            margin-bottom:15px; 
            color:#042d48;
            letter-spacing: 2px;
        }

        .pin { 
            font-size:40px; 
            letter-spacing:6px; 
            font-weight:bold; 
            margin-top:15px; 
            color:#e13320; 
        }

        #qrCode { 
            margin-top:10px; 
        }
        .lessonForm { 
            display:flex; 
            gap:8px; 
            margin-top:10px; 
            flex-wrap:wrap; 
        }

        .lessonForm input { 
            padding:6px; 
            border-radius:6px; 
            border:1px solid #ccc; 
            font-size:14px; 
            flex:1; 
        }

        .finishedSection { 
            margin-top:30px; 
            border-top:3px solid #ccc; 
            padding-top:10px; 
        }

        .finishedSection h3 { 
            margin-bottom:10px; 
        }

        .finishedLessons { 
            padding:6px 12px; 
            background:#ecf0f1; 
            margin-bottom:5px; 
            border-radius:6px; 
        }
        
         @media screen and (max-width: 768px) {
            .container {
                width: 90%;
            }
        }

    </style>
</head>
<body>

<header>
  <h1>Teacher's Dashboard</h1>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">
  <div class="left">
    <button onclick="addSubject()">+ Add Subject</button>
    <div id="subjectList" style="margin-top:20px;"></div>

    <div class="FinishedSection">
      <h3>Finished Lessons</h3>
      <div id="finishedLessons"></div>
    </div>
  </div>

  <div class="right">
    <div class="liveBox">
      <h2>Live Lesson</h2>
      <p id="liveTitle" style="font-size:18px; margin-bottom:10px;">Select an online lesson</p>
      <div class="pin" id="pin"></div>
      <div id="qrCode"></div>
      <p id="link"></p>
      <button id="endFeedback" onclick="endLesson()" style="display:none; margin-top:10px;">End Lesson</button>
      <button id="ViewLiveFeedback" onclick="openLiveFeedback()" style="margin-top:10px; display:none;">Live Feedback</button>
    </div>
  </div>

</div>
<script>
let subjects = [];
let finishedLessons = [];
let activeLesson = null;
let qr = null; 
const tutorUsername = localStorage.getItem("loggedInUsername");

const localDB = new PouchDB("sessions");
const remoteDB = new PouchDB("http://192.168.1.110:5984/sessions");

async function SyncFunc() {
    try {
        localDB.sync(remoteDB, {
            live: true,
            retry: true})
            .on('error', (err) => { console.error('Sync Error:', err); });

        localDB.changes({
            live: true,
            since: 'now'})
            .on('change', fetchDataAndRender);

        await fetchDataAndRender();
    } catch (error) {
        console.error("Database error: ", error);
    }
}

(async function intruderTutor() {
    const remoteUserDB = new PouchDB("http://192.168.1.110:5984/users");
    if (!tutorUsername) {
        alert("Login required");
        window.location.replace("sign.html?role=Tutor");
        return;
    }

    const userDB = new PouchDB("users");
    await userDB.sync(remoteUserDB);


    try {
        const user = await userDB.get("user_" + tutorUsername);

        if (user.role !== "Tutor") {
        alert("Access denied");
        window.location.replace("welcome.html");
        }
    } catch {
        console.error(err);
        alert("Invalid session");
        window.location.replace("welcome.html");
    }
})();

async function fetchDataAndRender() {

    const result = await localDB.allDocs({ include_docs: true });
    const filteredDocs = result.rows.map(row => row.doc).filter(doc => !doc._id.startsWith('_design/'));
    
    const subjectDocs = filteredDocs.filter(doc => doc.type === 'subject' && doc.tutorId === tutorUsername);
    const lessonDocs = filteredDocs.filter(doc => doc.type === 'lesson' && doc.tutorId === tutorUsername);
    
    subjects = subjectDocs.map(subject => ({
        ...subject,
        lessons: lessonDocs
            .filter(lesson => lesson.subjectId === subject._id)
            .sort((a, b) => new Date(a.startTime) - new Date(b.startTime))
    }));
    
    finishedLessons = lessonDocs.filter(lesson => lesson.ended);

    render();
}

function generatePin() {
    return Math.floor(100000 + Math.random() * 900000).toString();
}

function render() {
    const now = new Date();
    const subjectListContainer = document.getElementById("subjectList");

    const subjectDivs = subjectListContainer.children;

    for (let div of subjectDivs) {
        const subjectId = div.id.replace("subjectDiv-", "");
        const stillExists = subjects.some(s => s._id === subjectId);
        if (!stillExists) {
        subjectListContainer.removeChild(div);
        }
    }


    subjects.forEach(subject => {  
        let subjectDiv = document.getElementById(`subjectDiv-${subject._id}`);

        if (!subjectDiv) {
            subjectDiv = document.createElement("div");
            subjectDiv.className = "subject";
            subjectDiv.id = `subjectDiv-${subject._id}`;
            subjectDiv.innerHTML = `<h3>${subject.name}</h3>`; 

            const formDiv = document.createElement("div");
            formDiv.className = "lessonForm";
            formDiv.innerHTML = `
                <input type="text" placeholder="Lesson Name" id="lessonName-${subject._id}">
                <input type="datetime-local" id="lessonTime-${subject._id}">
                <button onclick="addLesson('${subject._id}')">Add Lesson</button>
            `;
            subjectDiv.appendChild(formDiv);

            const lessonListDiv = document.createElement("div");
            lessonListDiv.id = `lessonList-${subject._id}`;
            subjectDiv.appendChild(lessonListDiv);

            subjectListContainer.appendChild(subjectDiv);
        }
        
        const listDiv = document.getElementById(`lessonList-${subject._id}`);
        listDiv.innerHTML = "";

        subject.lessons.forEach(lesson => {
            const lessonStart = new Date(lesson.startTime);
            lesson.online = lessonStart <= now && !lesson.ended;

            const lessonElement = document.createElement("div");
            lessonElement.className = `lesson ${lesson.online ? "online" : "offline"}`;

            const startTimeStr = lessonStart.toLocaleString();
            let text = lesson.name;
            
            if (lesson.online) {
                text += ": Online";
            } else if (lesson.ended) {
                text += ": Finished";
            } else {
                text += `: Starts at ${startTimeStr})`;
            }
            
            lessonElement.textContent = text;

            if (lesson.online) {
                lessonElement.onclick = () => showLiveLesson(subject, lesson); 
            }
            
            listDiv.appendChild(lessonElement);
        });
    });

    renderFinished();
}

function renderFinished() {
    const container = document.getElementById("finishedLessons");
    container.innerHTML = ""; 

    finishedLessons.forEach(lesson => {
        const div = document.createElement("div");
        div.className = "FinishedLesson";
        div.style.display = "flex";
        div.style.justifyContent = "space-between";
        div.style.alignItems = "center";
        div.style.marginBottom = "6px";

        const textSpan = document.createElement("span");
        textSpan.textContent = `${lesson.name} ~ Average: ${lesson.avgRating}`;
        div.appendChild(textSpan);

        const button = document.createElement("button");
        button.textContent = "Diagram";
        button.style.fontSize = "14px";
        button.onclick = () => { 
            window.open(`diagram.html?lessonId=${lesson._id}`, "_blank") 
        };
        div.appendChild(button);

        container.appendChild(div);
    });
}

async function addSubject() {
    const name = prompt("Enter Subject name:");
    if (!name) return; 
    
    const tutorUsername = localStorage.getItem("loggedInUsername");

    const newSubject = {
        _id: `subject_${Date.now()}`, 
        type: 'subject', 
        name: name,
        tutorId: tutorUsername
    };

    try {
        await localDB.put(newSubject);
    } catch (err) {
        console.error("Failed to save subject:", err);
    }
}

async function addLesson(subjectId) {
    const nameInput = document.getElementById(`lessonName-${subjectId}`);
    const timeInput = document.getElementById(`lessonTime-${subjectId}`);
    const name = nameInput.value.trim();
    const startTime = timeInput.value;

    if (!name || !startTime) {
        alert("Please enter both the lesson name and start time.");
        return;
    }

    const newLesson = {
        _id: `lesson_${Date.now()}`,
        type: 'lesson',
        subjectId: subjectId,
        name: name,
        tutorId: tutorUsername,
        pin: generatePin(),
        subjectName: subjects.find(s => s._id === subjectId)?.name || "", 
        startTime: startTime,
        online: false,
        ended: false,
        avgRating: null,
    };

    try {
        await localDB.put(newLesson);
        nameInput.value = "";
        timeInput.value = "";
    } catch (err) {
        console.error("Failed to save lesson:", err);
    }
}

async function showLiveLesson(subject, lesson) {
    activeLesson = lesson;

    try {
        const doc = await localDB.get(lesson._id);
        if (!doc.online) {
            doc.online = true;
            await localDB.put(doc);
        }
    } catch (err) {
        console.error("Failed to mark online: ", err);
    }

    if (lesson.tutorId !== tutorUsername) {
        alert("You cannot access another tutor's lesson!");
        return;
    }

    let host = window.location.host; 
    if (host.includes("localhost") || host.includes("127.0.0.1")) {
        host = "192.168.1.110:5500"; 
    }

    const protocol = window.location.protocol; 
    const path = window.location.pathname.replace("tutor.html", "student.html");
    const fullUrl = `${protocol}//${host}${path}?pin=${lesson.pin}`;

    document.getElementById("liveTitle").textContent = `${subject.name}: ${lesson.name}`;
    document.getElementById("pin").textContent = lesson.pin;
    document.getElementById("link").textContent = fullUrl;
    document.getElementById("endFeedback").style.display = "inline-block";
    document.getElementById("ViewLiveFeedback").style.display = "inline-block";

    const qrCodeContainer = document.getElementById("qrCode");
    qrCodeContainer.innerHTML = ""; 
    qr = new QRCode(qrCodeContainer, {
        text: fullUrl,
        width: 180,
        height: 180
    }); 
}
async function endLesson() {

    if (!activeLesson) return;

    try {

        const lessonDoc = await localDB.get(activeLesson._id); 

        lessonDoc.ended = true;
        lessonDoc.online = false;
        await localDB.put(lessonDoc);

        activeLesson = null;
        document.getElementById("pin").textContent = "";
        document.getElementById("qrCode").innerHTML = "";
        document.getElementById("link").textContent = "";
        document.getElementById("endFeedback").style.display = "none";
        document.getElementById("ViewLiveFeedback").style.display = "none";
        document.getElementById("liveTitle").textContent = "Select an online lesson";
        
        render(); 

    } catch (error) {
        console.error("Failed to end lesson:", error);
    }
}



function openLiveFeedback() {
    const pin = activeLesson.pin;
    window.open(`liveView.html?pin=${pin}`, "_blank");
}

function logout() {
    localStorage.removeItem("loggedInUsername");
    window.location.href = "sign.html?role=Tutor"
}

SyncFunc();

setInterval(fetchDataAndRender, 15000);

</script>

</body>
</html>
