<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live View</title>
    <link rel="stylesheet" href="cssAll.css">
    <script src = "https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
    <style>
body {
    background: #f0f4f8;
    color: #333;
    padding: 20px;
}

h1 { 
    text-align: center;
    margin-bottom: 30px; 
}

.feedbackContainer {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    padding: 20px;
}

.feedbackItem {
    display: flex;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid #ddd;
    font-size: 16px;
}

.star {
    color: #f39c12;
    font-weight: bold;
}

.scale {
    font-weight: bold;
    color: #2980b9;
}

#status {
    text-align: center;
    margin-bottom: 20px;
    color: #555;
}

@media screen and (max-width: 768px) {
    .container {
         width: 90%;
    }
}
    </style>
</head>

<body>

<h1>Live Class Feedback :D </h1>

<p id="status">Waiting for feedback...</p>

<div class="feedbackContainer" id="feedbackContainer">
</div>


<script>
const localDB = new PouchDB("responses");
const remoteDB = new PouchDB("http://localhost:5984/responses");

localDB.sync(remoteDB, { live: true, retry: true });

const activePin = new URLSearchParams(window.location.search).get("pin");

async function fetchFeedback() {
    const result = await localDB.allDocs({ include_docs: true });

    const responses = result.rows
        .map(row => row.doc)
        .filter(doc => !doc._id.startsWith('_design/') && doc.type === "response" && doc.lessonPin === activePin);

    const container = document.getElementById("feedbackContainer");
    container.innerHTML = "";

    if (responses.length === 0) {
        document.getElementById("status").textContent = "Waiting for feedback...";
        return;
    }

    document.getElementById("status").textContent =
        `Responses sent: ${responses.length}`;

    const stats = {};

    responses.forEach(row => {
        row.answers.forEach(answer => {
            if (!stats[answer.question]) {
                stats[answer.question] = { total: 0, count: 0 };
            }
            stats[answer.question].total += answer.value;
            stats[answer.question].count += 1;
        });
    });

    Object.entries(stats).forEach(([question, data]) => {  //{ [key,value] , [key,value] } :)
        const avg = (data.total / data.count).toFixed(1);

        const div = document.createElement("div");
        div.className = "feedbackItem";
        div.innerHTML = `
            <span>${question}</span>
            <span class="star">${avg} ★</span>
        `;
        container.appendChild(div);
    });
}

async function SyncFunc() {
    try {
        
        localDB.sync(remoteDB, { live: true, retry: true })
            .on('change', () => { fetchFeedback(); })
            .on('error', err => { console.error('Sync Error:', err); });

        await fetchFeedback();
    } catch (error) {
            console.error("Database error:", error);
    }
}

SyncFunc();

setInterval(fetchFeedback, 2000);

</script>

</body>
</html>
