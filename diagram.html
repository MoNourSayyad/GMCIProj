<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson Diagrams</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
<style>
    body { 
        font-family: Arial, 
        sans-serif; 
        margin: 20px; 
        text-align:center; 
        background:#f4f4f4;
    }

    h2 { 
        color: #2c3e50; 
        margin-bottom: 20px; 
    }

    .chart-container {
        width: 95%;
        max-width: 600px;
        margin: 0 auto 40px auto;
        background:white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    canvas { 
        width: 100% !important; 
        height: auto !important; 
    }

</style>
</head>
<body>
<h2 id="lessonTitle">Lesson Diagram</h2>

<div class="chart-container">
    <canvas id="barChart"></canvas>
</div>

<div class="chart-container">
    <canvas id="lineChart"></canvas>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const lessonId = urlParams.get("lessonId");

if (!lessonId) alert("Lesson ID missing!");

const responsesDB = new PouchDB("responses");
const sessionsDB = new PouchDB("sessions");

async function renderStarBarChart(lessonId) {
    const responsesDB = new PouchDB("responses");

    const allResponses = await responsesDB.allDocs({ include_docs: true });
    const lessonResponses = allResponses.rows
        .map(row => row.doc)
        .filter(doc => doc.type === "response" && doc.lessonId === lessonId);
    
    
    const allSessions = await sessionsDB.allDocs({ include_docs: true });
    const lessonOfGraph = allSessions.rows
        .map(row => row.doc)
        .find(doc => doc.type === "lesson" && doc._id === lessonId);
    
    

    if (lessonResponses.length === 0) {
        alert("No feedback");
        return;
    }

    const starCounts = [0, 0, 0, 0, 0];
    lessonResponses.forEach(response => {
        response.answers.forEach(answer => {
            if (answer.value >= 1 && answer.value <= 5) starCounts[answer.value - 1] += 1;
        });
    });

    const roundedCounts = starCounts.map(c => Math.round(c / 2) * 2);

    const ctx = document.getElementById("barChart").getContext("2d");
    if (window.starBarChart) window.starBarChart.destroy();

    window.starBarChart = new Chart(ctx, {
        type: "bar",
        data: {
            labels: ["⭐", "⭐⭐", "⭐⭐⭐", "⭐⭐⭐⭐", "⭐⭐⭐⭐⭐"],
            datasets: [{
                label: "Votes",
                data: starCounts,
                backgroundColor: "rgba(46, 204, 113, 0.7)",
                borderColor: "rgba(46, 204, 113, 1)",
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    stepSize: 2, 
                    precision: 0,
                    max: Math.max(...starCounts, 4) + 2 
                }
            },
            plugins: {
                title: { 
                    display: true, 
                    text: `Star Ratings Distribution of ${lessonOfGraph.name}`,
                    font: {
                        size: 18,
                        weight: 'bold'
                    },
                    color: '#c0392b' 
                },
                legend: { display: false }
            }
        }
    });

    document.getElementById("barChart").parentElement.style.height = "300px";
}

async function renderLessonLineChart(lessonId) {
    const sessionsDB = new PouchDB("sessions");
    const lessonDoc = await sessionsDB.get(lessonId);

    const allLessons = (await sessionsDB.allDocs({ include_docs: true }))
        .rows.map(row => row.doc)
        .filter(lesson => lesson.type === "lesson" && lesson.subjectId === lessonDoc.subjectId)
        .sort((a, b) => new Date(a.startTime) - new Date(b.startTime));

    const lessonLabels = allLessons.map(lesson => lesson.name);
    const lessonAverages = allLessons.map(lesson => lesson.avgRating || 0);

    const allSessions = await sessionsDB.allDocs({ include_docs: true });
    const lessonOfGraph = allSessions.rows
        .map(row => row.doc)
        .find(doc => doc.type === "lesson" && doc._id === lessonId);

    const ctx = document.getElementById("lineChart").getContext("2d");
    if (window.lessonLineChart) window.lessonLineChart.destroy();

    window.lessonLineChart = new Chart(ctx, {
        type: "line",
        data: {
            labels: lessonLabels,
            datasets: [{
                label: "Lesson Average",
                data: lessonAverages,
                fill: false,
                borderColor: "rgba(52, 152, 219, 1)",
                backgroundColor: "rgba(52, 152, 219, 0.5)",
                tension: 0.3,
                pointRadius: 5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, max: 5 } },
            plugins: { 
                title: { 
                    display: true, 
                    text: `Lesson Average Comparison of ${lessonOfGraph.subjectName}`,
                    font: {
                        size: 18,
                        weight: 'bold'
                    },
                    color: '#c0392b' 
                },
                legend: { display: false }
            }
        }
    });
}

renderLessonLineChart(lessonId);
renderStarBarChart(lessonId);
</script>
</body>
</html>
